# Alembic configuration. The database URL comes from SMP_DATABASE_URL via app.config, not
# from this file, so the same migrations run against SQLite (dev/tests) and Postgres (prod).
#
#   python -m alembic upgrade head
#   python -m alembic revision -m "describe change"

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s
timezone = UTC
